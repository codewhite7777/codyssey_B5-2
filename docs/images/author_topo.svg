<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560"><defs><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="1" y="1" width="978" height="558" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="32" y="46" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="22" font-weight="800" fill="#111827" text-anchor="start" xml:space="preserve">작성자순 정렬 + '부모 먼저' 를 동시에 지키려면?</text><text x="32" y="72" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" xml:space="preserve">아이디어: 위상 정렬(Kahn)에서 '다음에 꺼낼 것'을 고를 때 작성자 이름이 가장 앞인 것을 고른다</text><line x1="210.0" y1="170" x2="162.0" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><line x1="360.0" y1="170" x2="312.0" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><line x1="210.0" y1="300" x2="162.0" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><rect x="62.0" y="204.0" width="96" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="110" y="226" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#713f12" text-anchor="middle" xml:space="preserve">C1</text><text x="110" y="245" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11.5" font-weight="500" fill="#713f12" text-anchor="middle" xml:space="preserve">Zoe</text><rect x="212.0" y="144.0" width="96" height="52" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="260" y="166" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#134e4a" text-anchor="middle" xml:space="preserve">C2</text><text x="260" y="185" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11.5" font-weight="500" fill="#134e4a" text-anchor="middle" xml:space="preserve">Bob</text><rect x="362.0" y="144.0" width="96" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410" y="166" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">C3</text><text x="410" y="185" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11.5" font-weight="500" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">Alice</text><rect x="212.0" y="274.0" width="96" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="260" y="296" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">C4</text><text x="260" y="315" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11.5" font-weight="500" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">Alice</text><rect x="500" y="100" width="450" height="92" rx="12" fill="#fff7f7" stroke="#dc2626" stroke-width="1.5"/><text x="520" y="128" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13.5" font-weight="800" fill="#dc2626" text-anchor="start" xml:space="preserve">그냥 작성자순 (지금 LOG --sort-by=author)</text><text x="520" y="154" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve">C3 Alice → C4 Alice → C2 Bob → C1 Zoe</text><text x="520" y="177" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" font-weight="600" fill="#dc2626" text-anchor="start" xml:space="preserve">× C3가 부모 C2, 조상 C1 보다 먼저 나옴</text><rect x="500" y="205" width="450" height="92" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="520" y="233" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13.5" font-weight="800" fill="#14532d" text-anchor="start" xml:space="preserve">위상 정렬 + 작성자 우선순위</text><text x="520" y="259" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve">C1 Zoe → C4 Alice → C2 Bob → C3 Alice</text><text x="520" y="282" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" font-weight="600" fill="#14532d" text-anchor="start" xml:space="preserve">✓ 부모가 항상 먼저 + 가능한 한 작성자순</text><rect x="40" y="330" width="910" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="58" y="353" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13.5" font-weight="800" fill="#111827" text-anchor="start" xml:space="preserve">출력 가능한 커밋 (진입 차수 0)</text><text x="268" y="353" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13.5" font-weight="800" fill="#111827" text-anchor="start" xml:space="preserve">작성자가 가장 앞인 것 꺼냄</text><text x="528" y="353" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13.5" font-weight="800" fill="#111827" text-anchor="start" xml:space="preserve">그 결과 새로 출력 가능해진 자식</text><text x="58" y="387" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="500" fill="#111827" text-anchor="start" xml:space="preserve">{C1 Zoe}</text><text x="268" y="387" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="800" fill="#7c3aed" text-anchor="start" xml:space="preserve">C1 Zoe</text><text x="528" y="387" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="500" fill="#111827" text-anchor="start" xml:space="preserve">C2 Bob, C4 Alice</text><text x="58" y="420" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="500" fill="#111827" text-anchor="start" xml:space="preserve">{C2 Bob, C4 Alice}</text><text x="268" y="420" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="800" fill="#7c3aed" text-anchor="start" xml:space="preserve">C4 Alice</text><text x="528" y="420" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="500" fill="#111827" text-anchor="start" xml:space="preserve">-</text><text x="58" y="453" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="500" fill="#111827" text-anchor="start" xml:space="preserve">{C2 Bob}</text><text x="268" y="453" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="800" fill="#7c3aed" text-anchor="start" xml:space="preserve">C2 Bob</text><text x="528" y="453" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="500" fill="#111827" text-anchor="start" xml:space="preserve">C3 Alice</text><text x="58" y="486" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="500" fill="#111827" text-anchor="start" xml:space="preserve">{C3 Alice}</text><text x="268" y="486" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13.5" font-weight="800" fill="#7c3aed" text-anchor="start" xml:space="preserve">C3 Alice</text><text x="528" y="486" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13.5" font-weight="500" fill="#111827" text-anchor="start" xml:space="preserve">-  (끝)</text><text x="48" y="522" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve">구현: 큐(deque) 대신 '작성자 이름 기준 우선순위 큐(최소 힙)' → O((V+E) log V)</text></svg>
