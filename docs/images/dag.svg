<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470"><defs><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="1" y="1" width="918" height="468" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="32" y="46" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="22" font-weight="800" fill="#111827" text-anchor="start" xml:space="preserve">왜 커밋 그래프는 DAG 여야 할까?</text><text x="32" y="72" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" xml:space="preserve">DAG = Directed(방향 있음) + Acyclic(돌아오는 길 없음) + Graph</text><rect x="30" y="95" width="420" height="345" rx="14" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/><rect x="50" y="109.5" width="92.67" height="25" rx="12.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="96.33500000000001" y="126.68" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle" xml:space="preserve">✓ 정상: DAG</text><rect x="52.0" y="234.0" width="96" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="100" y="256" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">356a192</text><text x="100" y="275" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11.5" font-weight="500" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">C1</text><rect x="187.0" y="169.0" width="96" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="235" y="191" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">da4b923</text><text x="235" y="210" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11.5" font-weight="500" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">C2</text><rect x="187.0" y="299.0" width="96" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="235" y="321" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">77de68d</text><text x="235" y="340" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11.5" font-weight="500" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">C3</text><rect x="322.0" y="299.0" width="96" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="370" y="321" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">1b64538</text><text x="370" y="340" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11.5" font-weight="500" fill="#1e3a8a" text-anchor="middle" xml:space="preserve">C4</text><line x1="185.0" y1="195" x2="152.0" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><line x1="185.0" y1="325" x2="152.0" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><line x1="320.0" y1="325" x2="287.0" y2="325" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><line x1="60" y1="395" x2="420" y2="395" stroke="#6b7280" stroke-width="1.5" marker-end="url(#m6b7280)"/><text x="240" y="418" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle" xml:space="preserve">시간 →   (화살표는 항상 과거 = 부모 쪽으로만)</text><text x="240" y="160" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" font-weight="600" fill="#16a34a" text-anchor="middle" xml:space="preserve">어디서 출발해도 화살표를 따라가면 언젠가 끝(root)에 도착</text><rect x="470" y="95" width="420" height="345" rx="14" fill="#fff7f7" stroke="#dc2626" stroke-width="1.5"/><rect x="490" y="109.5" width="152.73000000000002" height="25" rx="12.5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="566.365" y="126.68" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle" xml:space="preserve">× 사이클: 있으면 안 됨</text><rect x="645.0" y="156.0" width="70" height="38" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="680" y="180.04" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#7f1d1d" text-anchor="middle" xml:space="preserve">A</text><rect x="555.0" y="281.0" width="70" height="38" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="590" y="305.04" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#7f1d1d" text-anchor="middle" xml:space="preserve">B</text><rect x="735.0" y="281.0" width="70" height="38" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="770" y="305.04" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="14" font-weight="800" fill="#7f1d1d" text-anchor="middle" xml:space="preserve">C</text><line x1="655" y1="195" x2="610" y2="278" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mdc2626)"/><line x1="628" y1="300" x2="730" y2="300" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mdc2626)"/><line x1="752" y1="278" x2="705" y2="195" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mdc2626)"/><text x="680" y="255" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans Mono',monospace" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">A→B→C→A ...</text><text x="492" y="350" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="start" xml:space="preserve">• LOG: 누가 먼저? "부모 먼저" 출력이 불가능</text><text x="492" y="371" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="start" xml:space="preserve">• ANCESTORS: 조상 찾기가 끝나지 않음 (무한 반복)</text><text x="492" y="392" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="start" xml:space="preserve">• 애초에 불가능: 커밋은 부모 hash를 알아야 생김</text><text x="492" y="413" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="start" xml:space="preserve">   → 아직 없는 미래 커밋을 부모로 둘 수 없다</text></svg>
